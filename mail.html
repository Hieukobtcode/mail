<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dịch Vụ Thiết Kế Website</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@300;400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1E0D04;
            font-family: 'Inter', sans-serif;
        }

        .leaf-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .leaf {
            position: absolute;
            top: -50px;
            animation: fall linear infinite;
            opacity: 0.8;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            8% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(105vh) rotate(600deg) translateX(60px);
                opacity: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .leaf {
                display: none;
            }
        }

        .wrap {
            max-width: 580px;
            margin: 0 auto;
            overflow: hidden;
        }

        /* HERO */
        .hero {
            background: linear-gradient(150deg, #6B2D0E 0%, #2A1006 100%);
            padding: 52px 44px 44px;
            position: relative;
            overflow: hidden;
        }

        .hero::after {
            content: '🍁';
            position: absolute;
            right: 20px;
            top: 16px;
            font-size: 130px;
            opacity: 0.07;
            transform: rotate(-12deg);
        }

        .eyebrow {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #D4A84B;
            margin-bottom: 16px;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 40px;
            line-height: 1.15;
            color: #F0EAE0;
            margin-bottom: 14px;
        }

        .hero h1 em {
            font-style: italic;
            color: #D4A84B;
        }

        .hero p {
            font-size: 14px;
            color: rgba(240, 234, 224, 0.7);
            line-height: 1.7;
            font-weight: 300;
            max-width: 340px;
            margin-bottom: 28px;
        }

        .btn {
            display: inline-block;
            padding: 13px 30px;
            background: #C8681A;
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        /* SERVICES */
        .services {
            background: #FAF6EE;
            padding: 36px 44px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px 32px;
        }

        .svc-icon {
            font-size: 22px;
            margin-bottom: 8px;
            display: block;
        }

        .svc-name {
            font-family: 'Playfair Display', serif;
            font-size: 15px;
            color: #3B2314;
            margin-bottom: 4px;
        }

        .svc-desc {
            font-size: 12px;
            color: #7A5535;
            line-height: 1.6;
            font-weight: 300;
        }

        /* OFFER */
        .offer {
            background: #8B3A1C;
            padding: 24px 44px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .badge {
            background: #D4A84B;
            color: #fff;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 5px 12px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .offer-text strong {
            display: block;
            font-family: 'Playfair Display', serif;
            font-size: 17px;
            color: #F0EAE0;
            margin-bottom: 2px;
        }

        .offer-text span {
            font-size: 12px;
            color: rgba(240, 234, 224, 0.7);
            font-weight: 300;
        }

        /* FOOTER */
        .foot {
            background: #3B2314;
            padding: 28px 44px;
            text-align: center;
        }

        .foot-logo {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            color: #D4A84B;
            margin-bottom: 12px;
        }

        .foot a {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 28px;
            background: #C8681A;
            color: #fff;
            font-size: 12px;
            text-decoration: none;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .foot-info {
            margin-top: 16px;
            font-size: 11px;
            color: rgba(240, 234, 224, 0.4);
            line-height: 1.8;
        }

        .foot-info a {
            color: #D4A84B;
            text-decoration: none;
            opacity: 0.7;
        }

        @media (max-width:480px) {
            .hero {
                padding: 40px 24px 36px;
            }

            .hero h1 {
                font-size: 30px;
            }

            .services {
                padding: 28px 24px;
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .offer {
                padding: 20px 24px;
                flex-direction: column;
                gap: 12px;
            }

            .foot {
                padding: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="leaf-canvas" id="lc"></div>

    <div class="wrap">

        <div class="hero">
            <div class="eyebrow">ĐỒ ÁN TỐT NGHIỆP · FALL 2026</div>
            <h1>Đồ án sắp tới,<br><em>đừng để bạn phải lo một mình.</em></h1>
            <p>Chào {{ name }},nếu bạn đang gặp khó khăn và cần hỗ trợ cho đồ án kỳ này? Mình sẵn sàng đồng hành cùng bạn.</p>
            <a href="tel:0862319515" class="btn">Tư vấn trực tiếp </a>
        </div>
    </div>

    <script>
        const lc = document.getElementById('lc');
        const emojis = ['🍁', '🍂', '🍃'];
        for (let i = 0; i < 14; i++) {
            const l = document.createElement('div');
            l.className = 'leaf';
            l.textContent = emojis[i % 3];
            l.style.cssText = `
      left:${Math.random() * 100}%;
      font-size:${14 + Math.random() * 14}px;
      animation-duration:${9 + Math.random() * 10}s;
      animation-delay:${Math.random() * 14}s;
    `;
            lc.appendChild(l);
        }
    </script>
</body>

</html>
